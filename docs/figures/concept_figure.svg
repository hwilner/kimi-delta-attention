<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#FFFFFF"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#374151"/></marker></defs><text x="768" y="55.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#111827" text-anchor="middle" dominant-baseline="middle" font-weight="bold">Kimi Delta Attention: Fixed-State Memory with Delta Rule</text><rect x="60" y="140" width="170" height="90" rx="14" fill="#DBEAFE" stroke="#374151" stroke-width="2"/><text x="145" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" dominant-baseline="middle">key k_t</text><rect x="270" y="140" width="170" height="90" rx="14" fill="#D1FAE5" stroke="#374151" stroke-width="2"/><text x="355" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111827" text-anchor="middle" dominant-baseline="middle">value v_t</text><rect x="480" y="140" width="200" height="90" rx="14" fill="#FEF3C7" stroke="#374151" stroke-width="2"/><text x="580" y="185.0" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#111827" text-anchor="middle" dominant-baseline="middle">write strength β_t</text><rect x="720" y="140" width="230" height="90" rx="14" fill="#EDE9FE" stroke="#374151" stroke-width="2"/><text x="835" y="173.75" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111827" text-anchor="middle" dominant-baseline="middle">per-channel gate α_t</text><text x="835" y="196.25" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#111827" text-anchor="middle" dominant-baseline="middle">(one knob per row)</text><rect x="280" y="360" width="420" height="110" rx="14" fill="#FFEDD5" stroke="#374151" stroke-width="2"/><text x="490" y="402.5" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#111827" text-anc