ize="21" fill="#111827" text-anchor="middle" dominant-baseline="middle">KV cache grows with sequence</text><rect x="1100" y="380" width="52" height="50" rx="6" fill="#FCA5A5" stroke="#374151" stroke-width="2"/><rect x="1170" y="350" width="52" height="80" rx="6" fill="#FCA5A5" stroke="#374151" stroke-width="2"/><rect x="1240" y="320" width="52" height="110" rx="6" fill="#FCA5A5" stroke="#374151" stroke-width="2"/><rect x="1310" y="290" width="52" height="140" rx="6" fill="#FCA5A5" stroke="#374151" stroke-width="2"/><rect x="1380" y="260" width="52" height="170" rx="6" fill="#FCA5A5" stroke="#374151" stroke-width="2"/><rect x="1450" y="230" width="52" height="200" rx="6" fill="#FCA5A5" stroke="#374151" stroke-width="2"/><line x1="1085" y1="430" x2="1515" y2="430" stroke="#374151" stroke-width="2.5"/><text x="1290" y="520.0" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#111827" text-anchor="middle" dominant-baseline="middle">KDA state: fixed size</text><rect x="1100" y="590" width="52" height="110" rx="6" fill="#A7F3D0" stroke="#374151" stroke-width="2"/><rect x="1170" y="590" width="52" height="110" rx="6" fill="#A7F3D0" stroke="#374151" stroke-width="2"/><rect x="1240" y="590" width="52" height="110" rx="6" fill="#A7F3D0" stroke="#374151" stroke-width="2"/><rect x="1310" y="590" width="52" height="110" rx="6" fill="#A7F3D0" stroke="#374151" stroke-width="2"/><rect x="1380" y="590" width="52" height="110" rx="6" fill="#A7F3D0" stroke="#374151" stroke-width="2"/><rect x="1450" y="590" width="52" height="110" rx="6" fill="#A7F3D0" stroke="#374151" stroke-width="2"/><line x1="1085" y1="700" x2="1515" y2="700" stroke="#374151" stroke-width="2.5"/></svg>