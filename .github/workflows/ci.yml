name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the in-flight run, but never a run on
# main, so the required status check always reflects the latest main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite
        run: pytest tests/ -v --cov=kda --cov-report=term-missing

  docs:
    name: Documentation and packaging consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          pip install -e .

      - name: Verify distribution metadata builds and version resolves
        run: |
          python -m build --wheel --outdir dist/
          twine check --strict dist/*.whl

      - name: Verify benchmark example runs
        run: |
          python examples/benchmark.py --seq-len 128 --batch-size 1 \
            --num-heads 2 --d-model 128 --iters 1 --warmup 0
